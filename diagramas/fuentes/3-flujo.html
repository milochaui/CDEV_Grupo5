<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="comun.css">
<style>
body { width: 1240px; height: 1540px; position: relative; }
.paso { position: absolute; left: 200px; width: 520px; min-height: 68px; border: 2px solid; border-radius: 10px; padding: 9px 14px 9px 64px; font-size: 13.5px; line-height: 1.35; }
.paso b { display: block; font-size: 17px; margin-bottom: 2px; }
.paso .n { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.llegada { background: #fff0d9; border-color: #f59a00; } .llegada .n { background: #f59a00; }
.show { background: #ffe3e8; border-color: #f03a5b; } .show .n { background: #f03a5b; }
.recorrido { background: #e3f1fd; border-color: #36a3f5; } .recorrido .n { background: #36a3f5; }
.manana { background: #e2f4f1; border-color: #2e9d8f; } .manana .n { background: #2e9d8f; }
.fase { position: absolute; left: 22px; width: 28px; border-radius: 6px; color: #fff; font-weight: bold; font-size: 12px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; }
.fase span { transform: rotate(-90deg); white-space: nowrap; }
.nota { position: absolute; left: 790px; width: 420px; border: 2px dashed; border-radius: 10px; padding: 9px 14px; font-size: 13px; line-height: 1.35; }
.nota b { display: block; font-size: 15px; margin-bottom: 2px; }
.violeta { background: #f5effa; border-color: #8a55c0; } .violeta b { color: #7a44b0; }
.gris { background: #f4f4f4; border-color: #777; } .gris b { color: #666; }
.azul { background: #eef3fa; border-color: #1f3a68; border-style: solid; } .azul b { color: #1f3a68; }
</style></head><body>
<h1>Flujo de la experiencia</h1>
<div id="contenido"></div>
<script>
const pasos = [
  ['llegada', 'Pantalla de inicio', 'Título, bandas del cartel (también las de la carpa) y controles. Con el clic para entrar se habilita el sonido.'],
  ['llegada', 'Entrada', 'Aparece afuera, en el pasillo vallado, frente al portal. El reloj marca las 17:58; a las 18:00 suben las primeras bandas.'],
  ['llegada', 'Plaza central', 'Cruza el portal, pasa por la barra y llega al centro: escucha las tres bandas de fondo.'],
  ['show', 'Elección', 'Camina hacia un escenario o hacia la carpa: esa banda crece en volumen y las otras se apagan.'],
  ['show', 'Entre el público', 'Salta, levanta los brazos, canta y hace pogo; contagia a la gente de alrededor.'],
  ['show', 'La ronda', 'Antes del boom de un tema conocido se abre la ronda; cuando explota, vuelan papelitos y el pogo lo lleva puesto.'],
  ['show', '¡Aguante!', 'Con el aguante-metro lleno, el cantante se da vuelta y lo saluda.'],
  ['show', 'Fin del tema', 'Aplausos y gritos; si era un tema conocido, fuegos artificiales.'],
  ['show', '¡Otra, otra!', 'Termina una banda de la tarde y el público pide el bis. Si él también lo pide (Q o E), la banda vuelve y toca su tema conocido.'],
  ['show', 'Cambio de banda', 'La banda se baja, el cartel anuncia a la que sigue y cambian los trapos. A las 21:00 suben las principales.'],
  ['recorrido', 'Recorrido libre', 'Otro escenario, la carpa, la barra (fernet o choripán) o volver a la plaza.'],
  ['manana', 'La mañana siguiente', 'Con unos 5 fernets se desmaya. Se despierta a las 07:00 con el predio vacío, le habla el que barre y aparece el resumen de la noche.'],
];
const ARRIBA = 90, ESPACIO = 30;
const contenido = document.getElementById('contenido');
const unicos = { 11: 100, 12: 100 }; // pasos solos en su fase: más altos, para que entre el nombre
const tops = [];
let y = ARRIBA;
pasos.forEach(([clase, titulo, texto], i) => {
  const n = i + 1;
  contenido.insertAdjacentHTML('beforeend',
    `<div id="p${n}" class="paso ${clase}" style="top:${y}px;${unicos[n] ? 'min-height:' + unicos[n] + 'px' : ''}"><span class="n">${n}</span><b>${titulo}</b>${texto}</div>`);
  const caja = document.getElementById('p' + n);
  tops[n] = y;
  y += caja.offsetHeight + ESPACIO;
});
const fases = [['LLEGADA', 1, 3, '#f59a00'], ['EN EL SHOW', 4, 10, '#f03a5b'], ['RECORRIDO', 11, 11, '#36a3f5'], ['MAÑANA', 12, 12, '#2e9d8f']];
for (const [nombre, desde, hasta, color] of fases) {
  const top = tops[desde], alto = tops[hasta] + document.getElementById('p' + hasta).offsetHeight - top;
  contenido.insertAdjacentHTML('beforeend', `<div class="fase" style="top:${top}px;height:${alto}px;background:${color}"><span>${nombre}</span></div>`);
}
const notas = [
  ['n3', 3, 'violeta', 'Grilla de horarios (G)', 'Muestra qué banda toca en cada escenario y en la carpa, cuáles ya tocaron y cuál sigue.'],
  ['n5', 5, 'violeta', 'La chica pide subirse a los hombros', 'Si empieza un tema tranquilo: [1] sí, va en los hombros hasta que termina el tema; [2] no, se va.'],
  ['n8', 8, 'gris', 'Excepción', 'En el show de Callejeros no hay fuegos artificiales, por respeto a las víctimas de Cromañón.'],
  ['n9', 9, 'gris', 'Sin bis', 'Si nadie lo pide en unos 12 segundos, la banda se va. Las bandas de la noche no hacen bis: tocan sin parar.'],
  ['n11', 11, 'violeta', 'El celular (X) y el ladrón', 'Saca fotos y las ve en la galería (Z). Si lo tiene mucho tiempo afuera, aparece un ladrón; si se lo roba, lo puede perseguir con Shift para recuperarlo.'],
  ['n12', 12, 'violeta', 'Resumen de la noche', 'Bandas que vio, tiempo cantando y de pogo, saludos, bises, fotos, fernets, choripanes y qué pasó con el celular. Enter para cerrar.'],
];
for (const [id, fila, clase, titulo, texto] of notas) {
  contenido.insertAdjacentHTML('beforeend', `<div id="${id}" class="nota ${clase}" style="top:${tops[fila]}px"><b>${titulo}</b>${texto}</div>`);
}
contenido.insertAdjacentHTML('beforeend', `<div class="nota azul" style="top:${y + 4}px;left:200px;width:1010px"><b>En cualquier momento</b>
Esc / P: pausa (se detienen la música y el reloj) · clic para seguir &nbsp;·&nbsp; V: primera o tercera persona &nbsp;·&nbsp; M: silenciar el sonido &nbsp;·&nbsp; G: grilla &nbsp;·&nbsp; T: adelantar a la próxima banda</div>`);
document.title = String(y + 90);
</script>
<script src="flechas.js"></script>
<script>
for (let i = 1; i < 12; i++) flecha('p' + i, 'aba', 'p' + (i + 1), 'arr', i === 11 ? 'si se desmaya' : '');
flecha('p3', 'der', 'n3', 'izq', 'tecla G', {punteada: true});
flecha('p5', 'der', 'n5', 'izq', 'tema tranquilo', {punteada: true});
flecha('p8', 'der', 'n8', 'izq', '', {punteada: true});
flecha('p9', 'der', 'n9', 'izq', 'nadie lo pide', {punteada: true});
flecha('p11', 'der', 'n11', 'izq', 'tecla X', {punteada: true, d2: -12});
flecha('p12', 'der', 'n12', 'izq', '', {punteada: true});
// Vueltas: siguiente tema (8 → 5) y otro escenario (11 → 4).
const izq = (id) => { const r = document.getElementById(id).getBoundingClientRect(); return [r.left, r.top + r.height / 2]; };
let a = izq('p8'), b = izq('p5');
linea([a, [165, a[1]], [165, b[1]], b], 'siguiente tema', {color: '#1f3a68', marca: 'pa', txtDx: -2});
a = izq('p11'); b = izq('p4');
linea([a, [100, a[1]], [100, b[1]], b], 'otro escenario', {color: '#1f3a68', marca: 'pa'});
document.querySelectorAll('svg.capa text').forEach((t) => {
  if (t.textContent === 'siguiente tema' || t.textContent === 'otro escenario') {
    const x = +t.getAttribute('x'), y = +t.getAttribute('y');
    t.setAttribute('transform', `rotate(-90 ${x} ${y - 4})`);
    t.previousSibling.setAttribute('transform', `rotate(-90 ${x} ${y - 4})`);
  }
});
</script></body></html>
