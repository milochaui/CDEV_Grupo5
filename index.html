<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Festival</title>
    <style>
      /* Sacamos márgenes y barras de scroll para que el 3D ocupe toda la ventana */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Three.js agrega el <canvas> automáticamente desde main.js -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
