<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Festival</title>
    <style>
      /* Sacamos márgenes y barras de scroll para que el 3D ocupe toda la ventana */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }

      /* Pantalla de inicio: un cartel que tapa toda la escena con un fondo semitransparente */
      #pantalla-inicio {
        position: fixed;
        inset: 0; /* ocupa toda la ventana */
        display: flex; /* flex para centrar el contenido */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        cursor: pointer;
      }
      #pantalla-inicio h1 {
        font-size: 48px;
        margin: 0 0 24px;
      }
      #pantalla-inicio ul {
        list-style: none;
        padding: 0;
        margin: 0 0 32px;
        font-size: 18px;
        line-height: 1.8;
      }
      #pantalla-inicio .entrar {
        font-size: 24px;
        font-weight: bold;
        color: #ff3355;
      }

      /* Mira: un puntito blanco con borde negro en el centro exacto de la pantalla */
      #mira {
        display: none; /* se muestra recién cuando empieza el juego */
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        transform: translate(-50%, -50%); /* centra el punto sobre su propio medio */
        background: #fff;
        border: 1px solid #000;
        border-radius: 50%;
        pointer-events: none; /* que no moleste a los clics */
      }

      /* Indicador del tema que suena: un cartelito abajo a la izquierda */
      #tema-actual {
        display: none; /* se muestra solo cerca de un escenario */
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 14px;
        border-radius: 4px;
        pointer-events: none;
      }

      /* Aviso de silencio: un cartelito chico arriba a la derecha */
      #aviso-silencio {
        display: none; /* se muestra solo cuando el sonido está silenciado */
        position: fixed;
        top: 16px;
        right: 16px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 14px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Cartel de inicio. Al hacer clic se captura el mouse y empieza el juego -->
    <div id="pantalla-inicio">
      <h1 id="titulo-cartel">Simulador de Festival</h1>
      <ul>
        <li><b>Mouse</b>: mirar alrededor</li>
        <li><b>W A S D</b> o <b>flechas</b>: caminar</li>
        <li><b>Shift</b>: correr</li>
        <li><b>Esc</b> o <b>P</b>: pausa (vuelve a este cartel)</li>
        <li><b>M</b>: silenciar / activar el sonido</li>
      </ul>
      <p class="entrar" id="texto-clic">Hacé clic para entrar</p>
    </div>

    <!-- Aviso de sonido silenciado (aparece con la tecla M) -->
    <div id="aviso-silencio">🔇 Silenciado (M para activar)</div>

    <!-- Mira en el centro de la pantalla -->
    <div id="mira"></div>

    <!-- Tema que está sonando (lo completa main.js) -->
    <div id="tema-actual"></div>

    <!-- Three.js agrega el <canvas> automáticamente desde main.js -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
